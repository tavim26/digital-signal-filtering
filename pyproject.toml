[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-filtering"
version = "1.0.0"
description = "Butterworth low-pass, high-pass and band-pass filtering of CSV signals, with a Tkinter GUI and time/frequency-domain plots."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Octavian Mirisan" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
signal-filtering = "signal_filtering.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]